services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: diag
      POSTGRES_PASSWORD: diag_test_password
      POSTGRES_DB: diagdb
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=4
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diag -d diagdb"]
      interval: 2s
      timeout: 5s
      retries: 15
